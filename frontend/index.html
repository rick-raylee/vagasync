<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/vue.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vaga Sync - O buscador de vagas e candidatura automatizada inteligente com agentes de inteligência artificial. Conecte seu currículo e automatize inscrições." />
    <title>Vaga Sync | Automação e Busca de Vagas com IA</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- FontAwesome 6 Icons for premium UI design -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      /* ── Dark theme para os popups do Leaflet ── */
      .leaflet-popup-content-wrapper {
        background: #0d1426 !important;
        border: 1px solid rgba(59, 130, 246, 0.25) !important;
        border-radius: 12px !important;
        box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 0 1px rgba(59,130,246,0.1) !important;
        padding: 0 !important;
        color: #f8fafc !important;
        backdrop-filter: blur(16px);
      }
      .leaflet-popup-content {
        margin: 14px 16px !important;
        font-family: Inter, system-ui, sans-serif !important;
        color: #f8fafc !important;
        line-height: 1.5 !important;
      }
      .leaflet-popup-tip {
        background: #0d1426 !important;
        box-shadow: none !important;
      }
      .leaflet-popup-tip-container {
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      }
      .leaflet-popup-close-button {
        color: #64748b !important;
        font-size: 18px !important;
        padding: 6px 8px !important;
        top: 4px !important;
        right: 4px !important;
        transition: color 0.2s;
      }
      .leaflet-popup-close-button:hover {
        color: #ef4444 !important;
        background: rgba(239,68,68,0.1) !important;
        border-radius: 6px;
      }

      /* Controles do mapa (zoom) no tema escuro */
      .leaflet-control-zoom a {
        background: #0d1426 !important;
        color: #94a3b8 !important;
        border-color: rgba(255,255,255,0.1) !important;
        font-size: 16px !important;
      }
      .leaflet-control-zoom a:hover {
        background: rgba(59,130,246,0.15) !important;
        color: #60a5fa !important;
      }
      .leaflet-control-attribution {
        background: rgba(6,9,19,0.8) !important;
        color: #475569 !important;
        font-size: 10px !important;
        backdrop-filter: blur(4px);
      }
      .leaflet-control-attribution a {
        color: #60a5fa !important;
      }

      /* Remove borda azul padrão do container do mapa */
      .leaflet-container {
        background: #060913 !important;
        outline: none !important;
        font-family: Inter, sans-serif !important;
      }

      /* Animação para o ícone customizado */
      .leaflet-marker-icon {
        cursor: pointer !important;
      }
      .leaflet-marker-icon svg {
        transition: transform 0.15s ease, filter 0.15s ease;
        transform-origin: bottom center;
      }
      .leaflet-marker-icon:hover {
        z-index: 1000 !important;
      }
      .leaflet-marker-icon:hover svg {
        transform: scale(1.15) translateY(-3px);
        filter: brightness(1.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
